
name: BookingGo QA CI

on:
  push:
    branches:
      - jiyun/qa-testing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-checks:
    name: Build and Automated Tests
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ci-dummy-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-bookinggo.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-bookinggo
      VITE_FIREBASE_STORAGE_BUCKET: demo-bookinggo.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: "1:123456789:web:ci-demo"
      VITE_USE_FIREBASE_EMULATORS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests with Firestore Emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-bookinggo "npm test -- --run"

      - name: Verify production build
        run: npm run build
